[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "warpcore"
version = "1.0.0"
description = "Warpcore: AWS deployment system for Strands SDK agents and agentcore runtime"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Warpcore Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Version policy: the lower bound is the oldest release whose API this code
# actually uses; the upper bound excludes the next major, because every library
# here has broken something across a major before. uv.lock records the versions
# actually tested - these ranges say what is believed to work, not what is
# verified.
dependencies = [
    "boto3>=1.34.0,<2",
    # 8.2 separated CliRunner's result.stdout from result.stderr, which the CLI
    # tests depend on to assert that --json output is not polluted by logs.
    "click>=8.2.0,<9",
    "pyyaml>=6.0,<7",
    # v2 API throughout: model_copy, model_dump(mode=...), field_validator.
    "pydantic>=2.5.0,<3",
    "rich>=13.7.0,<15",
    "watchdog>=3.0.0,<7",
    "requests>=2.31.0,<3",
]

[project.optional-dependencies]
# The model behind `discover findings --llm-provider anthropic` and the
# agentic commands. Optional: without it the rules run on their own.
ai = [
    "anthropic>=1.0.0,<2",
]
dev = [
    "pytest>=7.4.0,<10",
    # moto 5 renamed the decorators to a single mock_aws; the tests use it.
    "moto>=5.0.0,<6",
    # moto's resourcegroupstaggingapi backend imports its glue backend,
    # which needs pyparsing; moto does not declare it.
    "pyparsing>=3.0.0,<4",
    # black's stable style changes each year, so cap the major to avoid a
    # toolchain upgrade silently reformatting the tree.
    "black>=24.0.0,<26",
    # ruff is pre-1.0 and adds rules in minor releases, which can newly fail
    # a previously clean lint.
    "ruff>=0.6.0,<1",
]

# Kept out of `dev` so a normal test run does not pull a 30MB toolchain that is
# only needed to cut a release.
build = [
    "pyinstaller>=6.0,<8",
]

[project.scripts]
warpcore = "warpcore.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/warpcore"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]
