[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "warpcore"
version = "1.0.0"
description = "Warpcore: AWS deployment system for Strands SDK agents and agentcore runtime"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Warpcore Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "boto3>=1.34.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
    "pydantic>=2.5.0",
    "rich>=13.7.0",
    "watchdog>=3.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "moto>=5.0.0",
    # moto's resourcegroupstaggingapi backend imports its glue backend,
    # which needs pyparsing; moto does not declare it.
    "pyparsing>=3.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
warpcore = "warpcore.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/warpcore"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]
